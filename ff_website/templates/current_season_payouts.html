{% extends "layout.html" %} {%block content%}
<div class="container-fluid content">
  <div class="row justify-content-center">
    {% for card in cards %}
    <div class="col text-center">
      <a href="{{url_for(card.link)}}">
        <img
          src="{{url_for('static', filename=card.filename)}}"
          class="thumbnail"
        />
      </a>
    </div>
    {% endfor %}
  </div>
  <hr class="separator" />
  <h1>Payouts</h1>
  <hr class="separator" />
  <div class="row">
    <div class="col-12 season_intro">
      <p class="text-justify">
        The league no longer plays for monetary prizes. Here, we play strictly
        for pride.
      </p>
    </div>
  </div>
</div>
{%endblock content %}
